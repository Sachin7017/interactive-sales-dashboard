<!doctype html
><html lang="en">
    <head>
        <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Revenue Overview — Sales Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--p:#0B0F1A;--c:#141B2D;--b:#212B42;--m:#8A93A8;--t:#EDEFF4;--a:#F2B84B;--g:#6FCF97;--r:#EB6E6E}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--t);font-family:Inter,"Segoe UI",system-ui,sans-serif}.wrap{min-height:100vh;padding:28px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:22px}.title{font-size:20px;font-weight:700}.sub{font-size:13px;color:var(--m);margin-top:3px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{cursor:pointer;border:1px solid var(--b);background:transparent;color:var(--m);border-radius:999px;padding:6px 14px;font-size:12.5px}.filter.active{color:var(--t)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;opacity:.4}.active .dot{opacity:1}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.card,.panel{background:var(--c);border:1px solid var(--b);border-radius:10px}.card{padding:18px 20px}.label{font-size:12.5px;color:var(--m)}.value{font-size:26px;font-weight:600;margin:6px 0}.delta{font-size:12.5px;font-weight:600}.up{color:var(--g)}.down{color:var(--r)}.small{font-size:12px;color:var(--m);margin-left:8px}.main{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}.bottom{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}.panel{padding:20px;min-width:0}.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}.pt{font-size:14.5px;font-weight:600}.ps{font-size:12px;color:var(--m);margin-top:2px}.chart{height:260px;position:relative}.chart.smallchart{height:220px}select{background:#1B2438;color:var(--t);border:1px solid var(--b);border-radius:6px;font-size:12px;padding:5px 8px}.reps{display:flex;flex-direction:column;gap:10px}.rep{display:flex;align-items:center;gap:12px}.rn{width:118px;font-size:12.5px}.rr{width:74px;font-size:11.5px;color:var(--m)}.track{flex:1;background:var(--b);border-radius:4px;height:7px;overflow:hidden}.fill{height:100%;border-radius:4px}.rev{width:64px;font-size:12.5px;text-align:right}.att{width:44px;font-size:11.5px;color:var(--m);text-align:right}@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.main,.bottom{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:20px 14px}.cards{grid-template-columns:1fr}.rr{display:none}.rn{width:90px}}
</style>
</head>
<body>
    <div class="wrap">
<div class="head">
    <div>
        <div class="title">Revenue Overview</div>
        <div class="sub">Q1–Q3 FY26 · figures in USD · sample data</div>
    </div>
        <div class="filters" id="filters"></div>
    </div>
<div class="cards" id="cards"></div>
<div class="main">
    <section class="panel">
        <div class="ph"><div>
            <div class="pt">Revenue by region</div>
            <div class="ps">Monthly, stacked by region</div>
        </div>
    </div>
            <div class="chart">
                <canvas id="region"></canvas>
            </div>
        </section>
<section class="panel">
    <div class="ph">
        <div>
            <div class="pt">Pipeline funnel</div>
            <div class="ps">Open deal value by stage</div>
        </div>
    </div>
    <div class="chart">
        <canvas id="pipeline"></canvas>
    </div>
</section>
</div>
<div class="bottom">
    <section class="panel">
        <div class="ph">
            <div>
                <div class="pt">Cumulative revenue</div>
                <div class="ps">Running total, filtered regions</div>
            </div>
        </div>
        <div class="chart smallchart">
            <canvas id="cumulative"></canvas>
        </div>
    </section>
<section class="panel">
    <div class="ph">
        <div>
            <div class="pt">Top reps</div>
            <div class="ps">Closed-won revenue and quota attainment</div>
        </div>
        <select id="sort">
            <option value="closed">Sort: Revenue</option>
            <option value="deals">Sort: Deals</option>
            <option value="attainment">Sort: Attainment</option>
        </select>
    </div>
    <div class="reps" id="reps"></div>
</section>
</div>
</div>
<script>
const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep"],R=["North America","EMEA","APAC","LATAM"],C={"North America":"#5B8DEF",EMEA:"#F2B84B",APAC:"#6FCF97",LATAM:"#EB6E6E"},P=[["Prospecting",812,"#3D5A80"],["Qualified",540,"#5B8DEF"],["Proposal",318,"#F2B84B"],["Negotiation",176,"#6FCF97"],["Closed Won",96,"#2E7D5B"]],Q=[["Priya Nair","APAC",18,320000,300000],["Marcus Webb","North America",24,481000,450000],["Sofia Marchetti","EMEA",15,264000,300000],["Diego Alvarez","LATAM",12,198000,180000],["Grace Kim","APAC",20,356000,340000],["Owen Fitzgerald","North America",21,402000,420000],["Amara Chukwu","EMEA",17,289000,260000]];
function seeded(x){return()=>{x=(x*9301+49297)%233280;return x/233280}}let z=seeded(42),base={"North America":420,EMEA:260,APAC:180,LATAM:90},D=M.map((m,i)=>{let o={month:m,total:0};R.forEach(r=>{base[r]=Math.max(40,base[r]+(z()-.35)*40+i*6);o[r]=Math.round(base[r]);o.total+=o[r]});return o}),A=new Set(R),S="closed";
const money=n=>n>=1e6?`$${(n/1e6).toFixed(2)}M`:n>=1e3?`$${(n/1e3).toFixed(0)}K`:`$${Math.round(n)}`;
R.forEach(r=>{let b=document.createElement("button");b.className="filter active";b.innerHTML=`<span class="dot" style="background:${C[r]}"></span>${r}`;b.onclick=()=>{A.has(r)?A.delete(r):A.add(r);b.classList.toggle("active",A.has(r));render()};filters.appendChild(b)});
function cards(){let cur=[...A].reduce((s,r)=>s+D.at(-1)[r],0),prev=[...A].reduce((s,r)=>s+D.at(-2)[r],0),rs=Q.filter(q=>A.has(q[1])),avg=rs.reduce((s,q)=>s+q[3],0)/Math.max(1,rs.reduce((s,q)=>s+q[2],0)),pipe=P.reduce((s,p)=>s+p[1],0),win=P[4][1]/P[0][1]*100,d=(cur-prev)/prev*100;let x=[["Revenue this month",money(cur),d,"vs. last month"],["Total pipeline value",money(pipe),4.2,"active deals"],["Avg. deal size",money(avg),-1.8,"closed-won deals"],["Win rate",win.toFixed(1)+"%",2.6,"prospecting → closed"]];cardsEl.innerHTML=x.map(v=>`<div class="card"><span class="label">${v[0]}</span><span class="value">${v[1]}</span><span class="delta ${v[2]>=0?"up":"down"}">${v[2]>=0?"+":""}${v[2].toFixed(1)}%<span class="small">${v[3]}</span></span></div>`).join("")}
Chart.defaults.color="#8A93A8";Chart.defaults.font.family='Inter,"Segoe UI",system-ui,sans-serif';let rc,pc,cc;
function renderCharts(){let o={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:"#1B2438",borderColor:"#212B42",borderWidth:1}},scales:{x:{grid:{color:"#212B42"},ticks:{color:"#8A93A8"}},y:{grid:{color:"#212B42"},ticks:{color:"#8A93A8",callback:v=>money(v)}}}};if(rc)rc.destroy();rc=new Chart(region,{type:"line",data:{labels:M,datasets:R.filter(r=>A.has(r)).map(r=>({label:r,data:D.map(d=>d[r]),borderColor:C[r],backgroundColor:C[r]+"22",fill:true,tension:.35,pointRadius:0,borderWidth:1.75}))},options:{...o,scales:{...o.scales,y:{...o.scales.y,stacked:true}}}});if(pc)pc.destroy();pc=new Chart(pipeline,{type:"bar",data:{labels:P.map(p=>p[0]),datasets:[{data:P.map(p=>p[1]),backgroundColor:P.map(p=>p[2]),borderRadius:4,barThickness:22}]},options:{...o,indexAxis:"y"}});let cum=0,cd=D.map(d=>{cum+=[...A].reduce((s,r)=>s+d[r],0);return cum});if(cc)cc.destroy();cc=new Chart(cumulative,{type:"line",data:{labels:M,datasets:[{data:cd,borderColor:"#F2B84B",backgroundColor:"#F2B84B18",fill:true,tension:.35,pointRadius:0,borderWidth:2.25}]},options:o})}
function reps(){let x=Q.filter(q=>A.has(q[1])).sort((a,b)=>S==="closed"?b[3]-a[3]:S==="deals"?b[2]-a[2]:b[3]/b[4]-a[3]/a[4]).slice(0,6);repsEl.innerHTML=x.map(q=>{let a=q[3]/q[4]*100;return`<div class="rep"><div class="rn">${q[0]}</div><div class="rr">${q[1]}</div><div class="track"><div class="fill" style="width:${Math.min(100,a)}%;background:${a>=100?"#6FCF97":"#F2B84B"}"></div></div><div class="rev">${money(q[3])}</div><div class="att">${a.toFixed(0)}%</div></div>`}).join("")}
const cardsEl=document.getElementById("cards"),repsEl=document.getElementById("reps");document.getElementById("sort").onchange=e=>{S=e.target.value;reps()};function render(){cards();renderCharts();reps()}render();
</script>
</body>
</html>
