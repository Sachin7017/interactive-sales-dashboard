<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Dashboard Demo</title>
<style>
body{font-family:Inter,Arial,sans-serif;margin:0;background:#f6f7fb;color:#20232a}
.wrap{max-width:1100px;margin:40px auto;padding:0 20px}
h1{margin-bottom:6px}.muted{color:#6b7280}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}
.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 5px 20px #0000000b}.value{font-size:28px;font-weight:700;margin-top:8px}
.panel{background:#fff;padding:24px;border-radius:16px}.bar{height:18px;background:#e9ecf3;border-radius:10px;margin:12px 0 22px;overflow:hidden}.fill{height:100%;width:var(--w);background:#4f46e5}
@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:500px){.cards{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<h1>Sales Performance Dashboard</h1><div class="muted">Interactive demo • sample data</div>
<div class="cards">
<div class="card"><div class="muted">Revenue</div><div class="value">₹8.42L</div></div>
<div class="card"><div class="muted">Orders</div><div class="value">1,284</div></div>
<div class="card"><div class="muted">Conversion</div><div class="value">7.8%</div></div>
<div class="card"><div class="muted">Growth</div><div class="value">+18.4%</div></div>
</div>
<div class="panel"><h2>Monthly Target</h2>
<p>January</p><div class="bar"><div class="fill" style="--w:72%"></div></div>
<p>February</p><div class="bar"><div class="fill" style="--w:84%"></div></div>
<p>March</p><div class="bar"><div class="fill" style="--w:91%"></div></div>
</div></div></body></html>
